  var TEMPLATE=`<style>
:host{display:block;--cream:#F5F0E8;--linen:#EDE6D6;--parchment:#E3D9C8;--warm-white:#F6F1E7;--bark:#2C2016;--clay:#6B4F35;--gold:#B8935A;--gold-lt:#D4B896;--charcoal:#1A1410;--near-black:#0F0C09;--mid:#8C7B68;--font-serif:"Cormorant Garamond",Georgia,serif;--font-sans:"Jost",system-ui,sans-serif;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
.pj{background:var(--cream);color:var(--bark);font-family:var(--font-sans);font-weight:300;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
img{display:block;max-width:100%;}
a:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}

.label{font-size:9px;font-weight:400;letter-spacing:.35em;text-transform:uppercase;color:var(--gold);display:block;}

.svc-name{font-family:var(--font-serif);font-style:italic;font-weight:300;line-height:1.02;}
.tag{font-size:9px;font-weight:400;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);display:block;}
.body{font-size:12.5px;letter-spacing:.04em;line-height:1.92;}
.body+.body{margin-top:14px;}

/* hero */
.hero{position:relative;width:100%;height:100svh;min-height:640px;max-height:980px;overflow:hidden;background:var(--near-black);}
.hero-bg{position:absolute;inset:0;width:100%;height:112%;object-fit:cover;object-position:center 40%;opacity:.5;will-change:transform;}
.hero-vignette{position:absolute;inset:0;background:linear-gradient(to top,rgba(15,12,9,.88) 0%,rgba(15,12,9,.1) 50%),linear-gradient(to bottom,rgba(15,12,9,.25) 0%,transparent 25%);z-index:1;}
.hero-content{position:absolute;bottom:0;left:0;right:0;padding:0 28px 60px;z-index:2;}
.hero-headline{font-family:var(--font-serif);font-style:italic;font-size:clamp(48px,13vw,72px);font-weight:300;line-height:.95;color:var(--warm-white);margin-bottom:12px;max-width:340px;}
.hero-headline span{color:var(--gold-lt);display:block;}
.hero-sub{font-size:11px;letter-spacing:.14em;color:rgba(250,247,242,.5);margin-bottom:14px;}
.hero-locale{font-size:10px;font-weight:400;letter-spacing:.3em;text-transform:uppercase;color:rgba(212,184,150,.82);margin-bottom:28px;}
.btn-ghost{display:inline-block;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--warm-white);text-decoration:none;border-bottom:1px solid rgba(250,247,242,.3);padding-bottom:3px;transition:color .2s,border-color .2s;}
.btn-ghost:hover{color:var(--gold-lt);border-color:var(--gold-lt);}

/* seo + marquee */
.seo-block{background:var(--warm-white);padding:12px 28px 8px;text-align:center;border-bottom:1px solid var(--parchment);}
.seo-block h1{font-family:var(--font-sans);font-size:10px;font-weight:300;letter-spacing:.18em;text-transform:uppercase;color:var(--parchment);line-height:1.6;margin-bottom:3px;}
.seo-block p{font-size:9px;color:var(--parchment);line-height:1.5;}
.marquee-wrap{background:var(--charcoal);padding:13px 0;overflow:hidden;border-top:1px solid rgba(184,147,90,.1);border-bottom:1px solid rgba(184,147,90,.1);}
.marquee-track{display:flex;width:max-content;animation:marquee 30s linear infinite;}
.marquee-item{font-size:9px;font-weight:400;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);white-space:nowrap;padding:0 24px;opacity:.72;}
.marquee-sep{font-size:9px;color:rgba(184,147,90,.28);}
@keyframes marquee{to{transform:translateX(-50%);}}

/* intro */
.intro{padding:96px 28px 72px;background:var(--cream);}
.intro.ww{background:var(--warm-white);}
.intro .label{margin-bottom:24px;}
.intro h2{font-family:var(--font-serif);font-style:italic;font-size:clamp(40px,12vw,68px);font-weight:300;color:var(--bark);line-height:1.0;margin-bottom:32px;max-width:7em;}
.intro p{font-size:13px;letter-spacing:.04em;color:var(--clay);line-height:1.95;max-width:330px;margin-left:auto;}
.intro p+p{margin-top:14px;}
.intro.center{text-align:center;}
.intro.center h2{margin-left:auto;margin-right:auto;max-width:9em;}
.intro.center p{margin-right:auto;}

/* pillars */
.pillars{background:var(--warm-white);padding:0 20px 20px;}
.gold-rule{width:36px;height:1px;background:var(--gold);opacity:.4;margin:0 auto 36px;}
.pillars-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--parchment);border:1px solid var(--parchment);max-width:600px;margin:0 auto;}
.pillar{background:var(--warm-white);padding:26px 16px 22px;text-align:center;}
.pillar-num{font-family:var(--font-serif);font-style:italic;font-size:26px;font-weight:300;color:var(--gold);opacity:.5;line-height:1;margin-bottom:9px;}
.pillar-title{font-size:9px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--bark);margin-bottom:8px;}
.pillar-body{font-size:11px;color:var(--mid);line-height:1.7;}
.book-band{display:flex;justify-content:center;padding:30px 28px 78px;background:inherit;}
.ww-bg{background:var(--warm-white);}
.cr-bg{background:var(--cream);}
.book-cta{display:inline-flex;align-items:center;gap:.8em;padding:13px 44px;background:rgba(250,247,242,.5);color:var(--bark);font-size:11px;font-weight:400;letter-spacing:.26em;text-transform:uppercase;text-decoration:none;border:1.5px solid #A6792F;border-radius:10px;box-shadow:0 4px 18px rgba(44,32,22,.06);transition:background .5s cubic-bezier(.16,1,.3,1),color .5s,box-shadow .5s,transform .5s;}
.book-cta:hover{background:#A6792F;color:var(--warm-white);box-shadow:0 11px 30px rgba(166,121,47,.3);transform:translateY(-2px);}
.book-cta .arr{transition:transform .5s;}
.book-cta:hover .arr{transform:translateX(5px);}

/* overture */
.overture{padding:80px 28px 24px;background:var(--cream);}
.overture.dark{background:var(--charcoal);}
.overture .role{margin-bottom:14px;}
.overture .nm{font-family:var(--font-serif);font-style:italic;font-size:clamp(56px,15vw,104px);font-weight:300;line-height:.9;color:var(--bark);}
.overture.dark .nm{color:var(--warm-white);}
.overture .sub{font-size:11px;letter-spacing:.05em;line-height:1.85;color:var(--mid);max-width:320px;margin-top:20px;}
.overture.dark .sub{color:rgba(250,247,242,.5);}

/* showpiece */
.showpiece{position:relative;width:100%;overflow:hidden;}
.showpiece img{width:100%;height:auto;max-height:92vh;object-fit:cover;}
.showpiece .cap{position:absolute;left:24px;bottom:24px;z-index:2;}
.showpiece::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(15,12,9,.55) 0%,transparent 45%);pointer-events:none;}
.showpiece .cap .svc-name{font-size:40px;color:var(--warm-white);text-shadow:0 2px 20px rgba(0,0,0,.4);}
.showpiece .cap .tag{color:var(--gold-lt);margin-top:4px;}

/* split */
.split{display:grid;grid-template-columns:62fr 38fr;align-items:center;background:var(--cream);}
.split.dark{background:var(--charcoal);}
.split .img-side{overflow:hidden;height:100%;}
.split .img-side img{width:100%;height:100%;object-fit:cover;min-height:380px;}
.split .text-side{padding:28px 22px;}
.split .idx{margin-bottom:8px;}
.split .svc-name{font-size:clamp(24px,6.5vw,34px);color:var(--bark);margin-bottom:10px;}
.split.dark .svc-name{color:var(--warm-white);}
.split .tag{margin-bottom:14px;}
.split .body{font-size:11.5px;line-height:1.85;color:var(--clay);}
.split.dark .body{color:rgba(250,247,242,.6);}
.split.flip{grid-template-columns:38fr 62fr;}
.split.flip .img-side{order:2;}

/* offset */
.offset-unit{background:var(--cream);padding:0 0 8px;}
.offset-unit.dark{background:var(--charcoal);}
.offset-unit .img-off{width:82%;overflow:hidden;}
.offset-unit.right .img-off{margin-left:18%;}
.offset-unit .img-off img{width:100%;height:auto;max-height:92vh;object-fit:cover;}
.offset-unit .text-off{padding:28px 28px 40px;max-width:460px;}
.offset-unit.right .text-off{margin-left:auto;text-align:right;}
.offset-unit .idx{margin-bottom:8px;}
.offset-unit .svc-name{font-size:clamp(28px,7.5vw,38px);color:var(--bark);margin-bottom:12px;}
.offset-unit.dark .svc-name{color:var(--warm-white);}
.offset-unit .tag{margin-bottom:16px;}
.offset-unit .body{color:var(--clay);}
.offset-unit.dark .body{color:rgba(250,247,242,.6);}

/* breath + atmo */
.breath{padding:72px 28px;text-align:center;background:var(--cream);}
.breath p{font-family:var(--font-serif);font-style:italic;font-size:clamp(22px,6vw,30px);font-weight:300;color:var(--clay);line-height:1.4;max-width:420px;margin:0 auto;}
.atmo-trans{position:relative;width:100%;overflow:hidden;}
.atmo-trans img{width:100%;height:auto;max-height:80vh;object-fit:cover;}
.atmo-trans .atmo-line{position:absolute;left:28px;bottom:28px;right:28px;z-index:2;}
.atmo-trans .atmo-line span{font-family:var(--font-serif);font-style:italic;font-size:clamp(20px,5.5vw,30px);font-weight:300;color:rgba(250,247,242,.92);line-height:1.3;text-shadow:0 2px 20px rgba(0,0,0,.45);}
.atmo-trans::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(15,12,9,.55) 0%,transparent 50%);pointer-events:none;}

/* care list (steps) */
.care{max-width:620px;margin:0 auto;padding:0 28px 82px;background:var(--cream);}
.care-wrap{background:var(--cream);}
.care-item{display:flex;gap:16px;align-items:flex-start;padding:18px 0;border-top:1px solid var(--parchment);}
.care-item:last-child{border-bottom:1px solid var(--parchment);}
.care-no{font-family:var(--font-serif);font-style:italic;font-size:18px;color:var(--gold);flex:none;line-height:1.6;}
.care-item p{font-size:14px;line-height:1.72;color:var(--clay);}
.care-item b{font-weight:500;color:var(--bark);}

/* book (dark) */
.types{margin:18px 0 18px;}
.type{padding:12px 0;border-top:1px solid rgba(212,184,150,.18);}
.type b{font-family:var(--font-serif);font-style:italic;font-weight:400;font-size:19px;color:var(--gold-lt);display:block;}
.type span{font-size:11.5px;color:rgba(250,247,242,.6);line-height:1.7;}
.incl{list-style:none;margin:6px 0 18px;}
.incl li{font-size:11.5px;color:rgba(250,247,242,.6);line-height:1.8;padding-left:16px;position:relative;}
.incl li::before{content:"";position:absolute;left:0;top:11px;width:8px;height:1px;background:var(--gold);}
.phone{font-family:var(--font-serif);font-style:italic;font-weight:300;font-size:clamp(28px,7vw,40px);color:var(--gold-lt);text-decoration:none;display:inline-block;margin:6px 0 4px;}
.book-note{padding:0 28px 80px;background:var(--charcoal);text-align:center;}
.book-note p{font-family:var(--font-serif);font-style:italic;font-weight:300;font-size:clamp(20px,5vw,26px);color:rgba(250,247,242,.85);line-height:1.4;max-width:460px;margin:0 auto 22px;}
.btn-gold{display:inline-block;font-size:10px;font-weight:500;letter-spacing:.26em;text-transform:uppercase;color:var(--charcoal);background:var(--gold-lt);padding:15px 36px;text-decoration:none;transition:background .22s;}
.btn-gold:hover{background:var(--gold);}

/* founder */
.founder-feature{display:flex;gap:34px;align-items:center;max-width:900px;margin:0 auto;padding:20px 28px 80px;flex-wrap:wrap;justify-content:center;}
.founder-wrap{background:var(--cream);}
.founder-wrap.dark{background:var(--charcoal);}
.founder-img{width:320px;max-width:80vw;border-radius:3px;object-fit:cover;aspect-ratio:3/4;}
.founder-copy{max-width:380px;}
.founder-copy .label{margin-bottom:14px;}
.founder-copy .body{color:var(--clay);font-size:13px;line-height:1.9;}
.founder-wrap.dark .founder-copy .body{color:rgba(250,247,242,.62);}

/* where */
.also{background:var(--cream);padding:8px 28px 40px;display:grid;grid-template-columns:1fr 1fr;gap:34px;max-width:900px;margin:0 auto;}
.also .svc-name{font-size:26px;color:var(--bark);margin-bottom:10px;}
.also .body{color:var(--clay);font-size:12px;}
.also-wrap{background:var(--cream);}

/* payoff + links */
.payoff{display:flex;gap:10px;justify-content:center;padding:0 20px 8px;background:var(--cream);}
.payoff img{width:330px;min-width:0;flex:0 1 330px;border-radius:3px;object-fit:cover;aspect-ratio:3/4;}
.links{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;padding:30px 28px 84px;background:var(--cream);}
.btn-underline{display:inline-block;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--bark);text-decoration:none;border-bottom:1px solid rgba(44,32,22,.28);padding-bottom:3px;}
.btn-underline:hover{color:var(--clay);border-color:var(--clay);}

/* final + faq */
.final-cta{background:var(--charcoal);padding:90px 28px 104px;text-align:center;}
.final-text{max-width:400px;margin:0 auto;}
.final-cta .label{margin-bottom:18px;}
.final-headline{font-family:var(--font-serif);font-style:italic;font-size:clamp(30px,9vw,44px);font-weight:300;color:var(--warm-white);line-height:1.12;margin:0 auto 18px;}
.final-body{font-size:12px;letter-spacing:.05em;color:rgba(250,247,242,.45);line-height:1.85;margin:0 auto 30px;}
.faq{background:var(--charcoal);border-top:1px solid rgba(212,184,150,.12);}
.faq-inner{max-width:780px;margin:0 auto;padding:96px 28px 104px;}
.faq .label{color:var(--gold-lt);}
.faq h2{font-family:var(--font-serif);font-style:italic;font-weight:300;font-size:clamp(30px,6vw,48px);color:var(--warm-white);line-height:1.05;margin-top:14px;}
.faq-list{margin-top:48px;}
.faq-item{padding:28px 0;border-top:1px solid rgba(212,184,150,.2);}
.faq-item:last-child{border-bottom:1px solid rgba(212,184,150,.2);}
.faq-item h3{font-family:var(--font-serif);font-style:italic;font-weight:400;font-size:23px;color:var(--gold-lt);margin-bottom:11px;}
.faq-item p{font-weight:300;font-size:15px;line-height:1.72;color:rgba(250,247,242,.8);max-width:64ch;}
.faq-item p+p{margin-top:10px;font-size:13.5px;color:rgba(250,247,242,.6);}
.foot{background:var(--near-black);padding:26px 28px;text-align:center;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(212,184,150,.5);line-height:2;}


/* booking section, first-draft treatment */
.pjbook{background:var(--charcoal);color:var(--warm-white);padding:84px 0;}
.pjb-wrap{max-width:1080px;margin:0 auto;padding:0 28px;}
.pjb-wrap::after{content:"";display:block;clear:both;}
.pjbook .label{color:var(--gold-lt);font-size:12.5px;letter-spacing:.28em;margin-bottom:14px;}
.pjb-lede{font-family:var(--font-serif);font-style:italic;font-weight:400;font-size:clamp(28px,3.8vw,40px);line-height:1.2;color:var(--warm-white);margin-bottom:28px;max-width:760px;}
.pjb-fig{float:left;width:36%;max-width:360px;aspect-ratio:3/4;overflow:hidden;margin:6px 48px 26px 0;}
.pjb-fig img{width:100%;height:100%;object-fit:cover;}
.pjbook p{font-size:16.5px;line-height:1.85;color:#DCD1BE;margin-bottom:1.05em;}
.pjb-types{margin:26px 0 28px;}
.pjb-type{padding:14px 0;border-top:1px solid rgba(245,240,232,.18);}
.pjb-type strong{font-family:var(--font-serif);font-style:italic;font-weight:500;font-size:22px;color:var(--warm-white);display:block;margin-bottom:2px;}
.pjb-type span{font-size:15px;color:#C9BBA4;}
.pjb-incl{list-style:none;margin:0 0 26px;}
.pjb-incl li{padding:6px 0 6px 22px;position:relative;font-size:15.5px;color:#DCD1BE;line-height:1.6;}
.pjb-incl li::before{content:"";position:absolute;left:0;top:15px;width:10px;height:1px;background:var(--gold-lt);}
.pjb-sign{font-family:var(--font-serif);font-style:italic;font-size:21px!important;color:var(--gold-lt)!important;line-height:1.5;}
.pjb-phone{font-family:var(--font-serif);font-style:italic;font-size:clamp(34px,5vw,48px);color:var(--gold-lt);text-decoration:none;display:inline-block;margin:4px 0 10px;}
@media (max-width:760px){.pjbook{padding:60px 0;}.pjb-wrap{padding:0 22px;}.pjb-fig{float:none;width:100%;max-width:none;aspect-ratio:4/5;margin:0 0 26px;}}


/* full-screen video */
.vid-full{position:relative;width:100%;height:100svh;min-height:560px;max-height:1000px;overflow:hidden;background:var(--near-black);}
.vid-full video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.vid-full::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(15,12,9,.6) 0%,transparent 40%);pointer-events:none;}
.vid-cap{position:absolute;left:28px;bottom:40px;z-index:2;}
.vid-cap .svc-name{font-size:clamp(32px,8vw,48px);color:var(--warm-white);text-shadow:0 2px 20px rgba(0,0,0,.4);}
.vid-cap .tag{color:var(--gold-lt);margin-top:6px;}

@media (max-width:640px){
  .split,.split.flip{grid-template-columns:1fr;}
  .split.flip .img-side{order:0;}
  .split .img-side img{min-height:0;aspect-ratio:4/5;}
  .split .text-side{padding:30px 28px 44px;}
  .also{grid-template-columns:1fr;}

<div class="care-wrap"><section class="care">
<div class="care-item reveal"><span class="care-no">01</span><p><b>Choose Your Style.</b> When you visit us at Cio Bela, you'll select from a variety of chain styles, lengths, and options for customizing your piece. You can pick a bracelet, necklace, anklet, or other personalized jewelry to represent a special bond or memory.</p></div>
<div class="care-item reveal"><span class="care-no">02</span><p><b>Fitting &amp; Adjustment.</b> We'll fit the jewelry on your wrist, ankle, or neck to ensure it's just the right size. If needed, we'll adjust the length so it's perfect for you.</p></div>
<div class="care-item reveal"><span class="care-no">03</span><p><b>Seamless Welding.</b> Instead of using a traditional clasp, we'll use a safe and quick welding process to permanently close the piece. This creates a seamless, durable connection that doesn't come off unless you decide to remove it.</p></div>
<div class="care-item reveal"><span class="care-no">04</span><p><b>Wear and Enjoy.</b> Once your piece is on, it's yours to keep! Permanent jewelry is designed to stay on for as long as you like, making it a beautiful, everyday reminder of special connections and memories.</p></div>
<div class="care-item reveal"><span class="care-no">05</span><p><b>Removal.</b> If you ever want to remove your permanent jewelry, we can safely take it off for you with no damage to your piece.</p></div>
</section></div>

<div class="text-off"><span class="idx">Hi, I'm Keleen Miller!</span>
<p class="body">I'm a wife, mother of three grown sons, and a nurse with over 30 years of experience. My love for jewelry began in childhood, and as my husband and I plan for retirement, I wanted a fun and creative way to stay connected with others. We raised our boys on California's beautiful Central Coast. Together, we're here to help families and friends create lasting memories through permanent jewelry.</p>
<p class="body">Our mission is to make every experience meaningful, whether it's a bonding moment between friends, a shared keepsake with family, or a little something special just for you. We're passionate about crafting jewelry that not only looks beautiful but also captures the stories and connections that matter most. We can't wait to help you create something unforgettable and look forward to being a part of your special moments!</p></div></div>
<section class="intro">
<span class="label reveal">Permanent Jewelry</span>
<h2 class="reveal d1">A connection you carry, always.</h2>
<p class="reveal d2">Permanent jewelry is a unique way to carry a special connection with you, always! Unlike traditional jewelry, our pieces don't have a clasp, which means they're designed to stay on for as long as you like. Instead, each bracelet, necklace, or anklet is custom-fitted and then carefully welded or closed directly on you, creating a seamless piece that's comfortable and secure.</p></section>

<p class="body">Our permanent jewelry is more than an accessory; it's a way to celebrate and remember important relationships and moments. Whether you're bonding with friends, creating a family memory, or marking a personal milestone, permanent jewelry captures those connections in a piece that stays with you every day.</p>
<p class="body">Choose from various chain styles and add personalized touches to make each piece uniquely yours. Come in alone, bring a friend, or make it a group experience. Let's create something beautiful that you can treasure forever!</p></div></div>

<div class="breath" style="padding-bottom:40px"><p class="reveal">Can't make it to the salon? Here are a couple more ways to link up.</p></div>
<div class="also-wrap"><div class="also">
<div class="reveal"><div class="svc-name">Shop Pop-Ups</div><p class="body">Catch us at pop-ups around the area! We're teaming up with your favorite local shops and businesses to bring permanent jewelry directly to you. Stop by one of our events, meet our team, and leave with a piece that's truly one-of-a-kind. Check our calendar for upcoming dates and locations. Your new favorite accessory might just be a visit away!</p></div>
<div class="reveal d1"><div class="svc-name">Private Parties</div><p class="body">Make your next celebration unforgettable with a touch of permanent jewelry! Perfect for birthdays, showers, bachelorette parties, and more, our team will bring the sparkle to you. Host a unique bonding experience and give your guests a keepsake they'll love. Ready to plan your event? Reach out to learn more about booking us for your special day!</p></div>

<span class="label reveal">Let's Link Up</span>
<h2 class="reveal d1">Upcoming events.</h2>
